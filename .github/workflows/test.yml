name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        # 3.8 is the oldest guard supports (macOS developer tools ship 3.9)
        python: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: JSON files parse
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json plugins/*/hooks/hooks.json; do
            uv run --no-project --python ${{ matrix.python }} -- python -m json.tool "$f" > /dev/null && echo "ok $f"
          done
      - name: guard and catalog tests
        run: uv run --no-project --python ${{ matrix.python }} -- python -I -m unittest discover -s tests -v
      - name: skill size budget (12 KB)
        run: |
          fail=0
          for f in plugins/*/skills/*/SKILL.md; do
            size=$(wc -c < "$f"); echo "$size $f"
            [ "$size" -le 12288 ] || { echo "::error file=$f::over 12 KB"; fail=1; }
          done
          exit $fail
